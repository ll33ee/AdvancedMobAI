# ------------------------------------------
# Configuration File for AdvancedMobAI
# ------------------------------------------

# === Creeper Settings ===
creeper:

  # --- Wall Breaching AI ---
  # Allows Creepers to attempt breaking thin walls when they lack direct line of sight
  # and are close to both the player and the wall.
  wall_breaching:
    enabled: true               # true to enable, false to disable this feature.
    max_check_distance: 5.0     # Maximum distance (blocks) the creeper checks ahead to find a wall.
    proximity_threshold: 1.8    # Maximum distance (blocks) to consider the creeper 'stuck' to the wall to explode.
    # (Should be slightly greater than 1.0 to work correctly).
    cooldown_seconds: 5         # Cooldown in seconds before the SAME creeper attempts ANOTHER special action (wall breach OR pillar explosion).
    # List of blocks the creeper will NOT attempt to break with this ability (besides Bedrock, Portals, etc.).
    # Very resistant vanilla blocks are already added automatically.
    resistant_blocks:
      - 'OBSIDIAN'
      - 'ANCIENT_DEBRIS'
      - 'NETHERITE_BLOCK'
      - 'CRYING_OBSIDIAN'
      - 'RESPAWN_ANCHOR'
      - 'ENCHANTING_TABLE' # Example: You don't want them breaking enchanting tables.
      - 'ENDER_CHEST'
      - 'ANVIL'
      - 'CHIPPED_ANVIL'
      - 'DAMAGED_ANVIL'
      - 'BEACON'
      # - 'IRON_BLOCK'   # Example if you want metal blocks to resist breaching
      # - 'DIAMOND_BLOCK'

  # --- Proactive Targeting AI ---
  # Allows idle Creepers to acquire a target if a player enters their close detection range.
  proactive_targeting:
    enabled: true               # true to enable, false to disable.
    range: 8.0                  # Maximum distance (blocks) at which an 'idle' creeper will detect a nearby player.

  # --- Pillar Explosion AI ---
  # Makes the Creeper explode if the player is nearby horizontally but elevated and unreachable directly.
  pillar_explosion:
    enabled: true               # true to enable, false to disable.
    max_horizontal_distance: 3.5 # Maximum horizontal distance (XZ plane) to the player to consider explosion.
    min_vertical_distance: 2.0   # Player must be at least this high above the creeper (Y difference).
    max_vertical_distance: 5.0   # Player must not be higher than this above the creeper (Y difference).


# === Enderman Settings ===
enderman:

  # --- Dismantler AI ---
  # Allows Endermen to remove blocks obstructing their path to a nearby player.
  dismantler_ai:
    enabled: true               # true to enable, false to disable.
    check_interval_ticks: 30    # How often to check (in ticks). Higher = less server load, slower reaction. (20 ticks = 1 second).
    max_check_distance: 6.0     # Maximum distance (blocks) to the player to attempt removing obstructing blocks.
    cooldown_seconds: 8         # Cooldown in seconds before the SAME Enderman removes ANOTHER block.
    # List of blocks the Enderman IS allowed to pick up for dismantling.
    # If you leave this list EMPTY (pickupable_blocks: []), it can pick up ANY block NOT in 'resistant_blocks'.
    # If you add blocks here, it can ONLY pick up blocks from this list (that are not resistant).
    pickupable_blocks:
      # --- Earth & Similar ---
